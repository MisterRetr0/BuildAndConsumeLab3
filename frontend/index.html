<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablero Kanban · API REST</title>

  <!-- Tipografía Inter (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ============ Variables globales ============ */
    :root {
      --bg: #070b1a;
      /* fondo oscuro base */
      --ink: #eaf0ff;
      /* texto principal */
      --muted: #9aa8d0;
      /* texto secundario */
      --accent: #6ee7f9;
      /* cian */
      --accent2: #a78bfa;
      /* violeta */
      --cell: 48px;
      /* tamaño de la cuadrícula de fondo */
    }

    * {
      box-sizing: border-box;
      margin: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--ink);
      background: var(--bg);
      overflow-x: hidden;
      padding: 48px 20px 64px;
    }

    /* [FRONT-BG] ============ Paisaje estilo Windows 97 ============
       SVG fijo detrás de todo: cielo azul degradado, nubes blancas y colinas verdes.
       Es estático (sin animación) y se escala para cubrir la pantalla. */
    .paisaje {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* ============ Liquid glass (header y columnas) ============ */
    /* [FRONT-BG] Tinte azul oscuro en lugar de blanco: el fondo ahora es claro
       y el texto blanco necesita contraste para leerse bien. */
    .glass {
      position: relative;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(8, 20, 60, .62), rgba(8, 20, 60, .42));
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, .18);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .45),
        inset 0 -1px 0 rgba(255, 255, 255, .06),
        inset 0 0 24px rgba(255, 255, 255, .05),
        0 20px 50px rgba(0, 0, 0, .35);
      overflow: hidden;
    }

    /* Brillo especular en la parte superior */
    .glass::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(120% 60% at 20% -10%, rgba(255, 255, 255, .28), transparent 55%);
    }

    /* Destello que cruza el panel periódicamente */
    .glass::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .16), transparent);
      transform: skewX(-18deg);
      animation: destello 7s ease-in-out infinite;
    }

    @keyframes destello {

      0%,
      60% {
        left: -60%;
      }

      100% {
        left: 130%;
      }
    }

    /* ============ Layout general ============ */
    main {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
    }

    header.glass {
      padding: 32px 36px;
    }

    h1 {
      font-size: clamp(1.7rem, 4vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .sub {
      color: var(--muted);
      margin-top: 8px;
      max-width: 60ch;
      line-height: 1.5;
    }

    /* Indicador de conexión con la API (verde = ok, rojo = error) */
    .estado {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(52, 211, 153, .12);
      border: 1px solid rgba(52, 211, 153, .35);
      font-size: .9rem;
    }

    .punto {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 0 0 rgba(52, 211, 153, .7);
      animation: pulso 2s infinite;
    }

    @keyframes pulso {
      70% {
        box-shadow: 0 0 0 10px rgba(52, 211, 153, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(52, 211, 153, 0);
      }
    }

    /* Variante de error: se activa desde JS con la clase .caido */
    .estado.caido {
      background: rgba(248, 113, 113, .12);
      border-color: rgba(248, 113, 113, .4);
    }

    .estado.caido .punto {
      background: #f87171;
      animation: none;
    }

    /* ============ Formulario para nueva tarea ============ */
    .nueva {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .nueva input {
      flex: 1;
      min-width: 200px;
      padding: 13px 18px;
      border-radius: 999px;
      font: inherit;
      color: var(--ink);
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .18);
    }

    .nueva input::placeholder {
      color: var(--muted);
    }

    .nueva button {
      padding: 13px 26px;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: #08112b;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 6px 18px rgba(110, 231, 249, .3);
      transition: transform .2s;
    }

    .nueva button:hover {
      transform: translateY(-2px);
    }

    /* [RETO] Variante roja para la acción destructiva */
    .nueva button.peligro {
      color: #fff;
      background: linear-gradient(135deg, #f87171, #dc2626);
      box-shadow: 0 6px 18px rgba(220, 38, 38, .35);
    }

    /* ============ Tablero (3 columnas) ============ */
    .tablero {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }

    .columna {
      padding: 22px;
      min-height: 320px;
      transition: outline-color .2s;
    }

    /* Encabezado de columna: título + contador de tarjetas */
    .columna h2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .contador {
      min-width: 28px;
      padding: 2px 10px;
      border-radius: 999px;
      text-align: center;
      font-size: .8rem;
      font-weight: 600;
      color: #08112b;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
    }

    .lista {
      display: grid;
      gap: 12px;
      min-height: 220px;
      align-content: start;
    }

    /* Feedback visual mientras se arrastra una tarjeta sobre la columna */
    .columna.sobre {
      outline: 2px dashed var(--accent);
      outline-offset: -6px;
    }

    /* Mensaje cuando una columna no tiene tareas */
    .vacio {
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
      padding: 24px 0;
    }

    /* ============ Tarjeta de tarea ============ */
    /* Fondo translúcido simple (sin backdrop-filter) para no frenar con muchas tarjetas */
    .tarea {
      position: relative;
      z-index: 1;
      /* queda por encima de los brillos ::before/::after de .glass */
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-radius: 18px;
      cursor: grab;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .14);
      line-height: 1.4;
      word-break: break-word;
      /* [FRONT-CARD] Se eliminó la animación: sin transition ni transform en hover */
    }

    .tarea:active {
      cursor: grabbing;
    }

    .tarea.arrastrando {
      opacity: .4;
    }

    .tarea button {
      background: none;
      border: 0;
      color: var(--muted);
      font-size: 1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 8px;
    }

    .tarea button:hover {
      color: #f87171;
      background: rgba(248, 113, 113, .12);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Accesibilidad: sin animaciones si el usuario lo pide */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- [FRONT-BG] Paisaje estilo Windows 97: cielo, nubes y colinas (SVG estático) -->
  <svg class="paisaje" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <!-- Cielo: azul intenso arriba, celeste cerca del horizonte -->
      <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1a5fd0" />
        <stop offset="0.65" stop-color="#6fb4f5" />
        <stop offset="1" stop-color="#bfe3ff" />
      </linearGradient>
    </defs>
    <rect width="1600" height="900" fill="url(#cielo)" />

    <!-- Nubes: grupos de elipses blancas superpuestas -->
    <g fill="#ffffff" opacity="0.95">
      <ellipse cx="260" cy="170" rx="120" ry="38" />
      <ellipse cx="340" cy="150" rx="90" ry="36" />
      <ellipse cx="190" cy="155" rx="70" ry="30" />
      <ellipse cx="900" cy="110" rx="150" ry="42" />
      <ellipse cx="990" cy="90" rx="100" ry="38" />
      <ellipse cx="800" cy="100" rx="80" ry="32" />
      <ellipse cx="1330" cy="230" rx="130" ry="36" />
      <ellipse cx="1410" cy="212" rx="85" ry="32" />
      <ellipse cx="1250" cy="218" rx="70" ry="28" />
    </g>

    <!-- Colinas: de la más lejana (clara) a la más cercana (oscura) -->
    <path d="M0 600 Q 250 500 520 580 T 1050 560 T 1600 590 V900 H0 Z" fill="#4cb043" />
    <path d="M0 680 Q 300 590 640 660 T 1180 650 T 1600 670 V900 H0 Z" fill="#389a32" />
    <path d="M0 770 Q 350 700 760 760 T 1300 750 T 1600 770 V900 H0 Z" fill="#26802a" />
  </svg>

  <main>
    <header class="glass">
      <h1>Tablero Kanban</h1>
      <p class="sub">Tareas consumidas desde la API REST. Arrastra las tarjetas entre columnas para cambiar su estado.
      </p>

      <!-- Indicador de conexión: lo actualiza cargarTareas() -->
      <div class="estado" id="estadoApi"><span class="punto"></span><span id="textoEstado">Conectando...</span></div>

      <!-- Formulario: Enter o clic en Agregar crean la tarea -->
      <form class="nueva" onsubmit="event.preventDefault(); agregarTarea()">
        <input type="text" id="inputTarea" placeholder="Escribe una nueva tarea..." autocomplete="off">
        <button type="submit">Agregar</button>
        <!-- [RETO] Botón de eliminación total: dispara eliminarTodas() -->
        <button type="button" class="peligro" onclick="eliminarTodas()">Eliminar todo</button>
      </form>
    </header>

    <!-- Las columnas se identifican con data-estado, que coincide con el campo "estado" del backend -->
    <section class="tablero">
      <div class="columna glass" data-estado="pendiente">
        <h2>Pendiente <span class="contador">0</span></h2>
        <div class="lista"></div>
      </div>
      <div class="columna glass" data-estado="progreso">
        <h2>En progreso <span class="contador">0</span></h2>
        <div class="lista"></div>
      </div>
      <div class="columna glass" data-estado="hecho">
        <h2>Hecho <span class="contador">0</span></h2>
        <div class="lista"></div>
      </div>
    </section>
  </main>

  <script>
    // Apuntamos al puerto expuesto de nuestra API
    const API_URL = 'http://localhost:5000/api/tareas';

    // ---------- 1. CONSUMIR [GET] y pintar el tablero ----------
    async function cargarTareas() {
      const estadoApi = document.getElementById('estadoApi');
      const textoEstado = document.getElementById('textoEstado');
      let tareas;

      try {
        const respuesta = await fetch(API_URL);
        tareas = await respuesta.json();
        // API disponible: indicador verde
        estadoApi.classList.remove('caido');
        textoEstado.textContent = 'API conectada';
      } catch (error) {
        // API caída o bloqueada por CORS: indicador rojo y salimos
        estadoApi.classList.add('caido');
        textoEstado.textContent = 'Sin conexión con la API';
        return;
      }

      // Vaciamos todas las columnas antes de repintar
      document.querySelectorAll('.lista').forEach(l => l.innerHTML = '');

      tareas.forEach(t => {
        // Construimos la tarjeta con createElement: textContent evita inyección de HTML
        const card = document.createElement('div');
        card.className = 'tarea';
        card.draggable = true;

        const texto = document.createElement('span');
        texto.textContent = t.texto;

        const borrar = document.createElement('button');
        borrar.textContent = '✕';
        borrar.title = 'Eliminar tarea';
        borrar.setAttribute('aria-label', 'Eliminar tarea');
        borrar.onclick = () => eliminarTarea(t.id);

        card.append(texto, borrar);

        // Al empezar a arrastrar guardamos el id; la clase da feedback visual
        card.addEventListener('dragstart', e => {
          e.dataTransfer.setData('text/plain', t.id);
          card.classList.add('arrastrando');
        });
        card.addEventListener('dragend', () => card.classList.remove('arrastrando'));

        // Colocamos la tarjeta en la columna que corresponde a su estado
        const destino = document.querySelector(`[data-estado="${t.estado}"] .lista`);
        if (destino) destino.appendChild(card);
      });

      actualizarColumnas();
    }

    // Actualiza el contador de cada columna y muestra "Sin tareas" si está vacía
    function actualizarColumnas() {
      document.querySelectorAll('.columna').forEach(col => {
        const lista = col.querySelector('.lista');
        const total = lista.querySelectorAll('.tarea').length;
        col.querySelector('.contador').textContent = total;
        if (total === 0) lista.innerHTML = '<p class="vacio">Sin tareas</p>';
      });
    }

    // ---------- 2. CONSUMIR [POST] ----------
    async function agregarTarea() {
      const input = document.getElementById('inputTarea');
      const texto = input.value.trim();
      if (!texto) return; // ignora vacío o solo espacios

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texto })
      });
      input.value = '';
      cargarTareas(); // Refrescar la vista
    }

    // ---------- 3. CONSUMIR [DELETE] ----------
    async function eliminarTarea(id) {
      await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
      cargarTareas(); // Refrescar la vista
    }

    // ---------- [RETO] 3b. CONSUMIR [DELETE] eliminación total ----------
    // Llama a DELETE /api/tareas (sin id). Pide confirmación porque no se puede deshacer.
    async function eliminarTodas() {
      if (!confirm('¿Eliminar TODAS las tareas? Esta acción no se puede deshacer.')) return;
      await fetch(API_URL, { method: 'DELETE' });
      cargarTareas(); // Refrescar la vista
    }

    // ---------- 4. CONSUMIR [PATCH] con drag & drop ----------
    document.querySelectorAll('.columna').forEach(col => {
      // preventDefault en dragover es obligatorio: sin él el navegador no permite soltar
      col.addEventListener('dragover', e => {
        e.preventDefault();
        col.classList.add('sobre');
      });
      col.addEventListener('dragleave', () => col.classList.remove('sobre'));

      // Al soltar, enviamos el nuevo estado (el de la columna destino) a la API
      col.addEventListener('drop', async e => {
        e.preventDefault();
        col.classList.remove('sobre');
        const id = e.dataTransfer.getData('text/plain');
        await fetch(`${API_URL}/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ estado: col.dataset.estado })
        });
        cargarTareas();
      });
    });

    // Carga inicial
    cargarTareas();
  </script>
</body>

</html>
